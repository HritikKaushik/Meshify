name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # version is read from packageManager in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck, build, test
        run: pnpm exec turbo run typecheck build test

      # Full dependency audit (prod + dev). Transitive-only advisories that the
      # dependents haven't re-released for are lifted with scoped `pnpm.overrides`
      # in package.json (one per vulnerable major). If a future dev-only advisory
      # has no fix yet and must ship, narrow this to `--prod` (dev tooling isn't in
      # the images or run in prod) rather than lowering the level.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # Secret scanning across the full history — catches a committed key before it
  # ships. gitleaks-action is free for personal repos.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Render Blueprint is deploy config: a typo there fails only at Blueprint
  # sync time, in the Dashboard. Validate it against Render's published JSON
  # schema so a broken render.yaml never reaches main.
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate render.yaml against Render's schema
        run: |
          curl -fsSL https://render.com/schema/render.yaml.json -o /tmp/render.schema.json
          # Render's schema is draft 2020-12 and uses `format: uri`, so run ajv non-strict with ajv-formats.
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 --strict=false -c ajv-formats --all-errors \
            -s /tmp/render.schema.json -d render.yaml

  # Build (and, on main, publish) the deployable backend images. Catches
  # Dockerfile/packaging regressions that the JS build can't — e.g. a missing
  # COPY of migrations or the lockfile — which have bitten us before. The bff is
  # a plain Node service (no build args), so it rides the same matrix; web needs
  # a build-time VITE_ arg and is built in its own job below.
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [platform-api, worker, observability, bff]
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository_owner }}/meshify-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only authenticate/push on main; PRs from forks can't access packages:write.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true # keep the image in the local daemon so Trivy can scan it
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'pr' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Fail only on FIXABLE high/critical CVEs — unfixable base-image noise
      # shouldn't block a release; a fixable one means "rebuild on a newer base".
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The web SPA is built separately because it bakes a build-time public var
  # (VITE_CLERK_PUBLISHABLE_KEY — publishable/non-secret) into the bundle, so the
  # image is environment-specific. The key comes from a repo variable (Settings →
  # Variables); an empty value still builds fine (the key is only read at runtime).
  web-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/meshify-web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true # keep the image in the local daemon so Trivy can scan it
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'pr' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
