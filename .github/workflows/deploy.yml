# Tag-triggered production deploy. Push a version tag (e.g. `v1.2.0`) to run it.
#
# SCAFFOLD — the actual rollout step is intentionally left as a placeholder
# because it depends on the hosting platform you wire up (see the deployment
# runbook in docs/operations/). What IS encoded here is the safe ORDER every
# production deploy must follow: migrate the database FIRST, then roll out, then
# smoke-test. Fill in the marked steps and the referenced repository secrets.
name: Deploy

on:
  push:
    tags: ["v*"]

# Never run two production deploys at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production # gate on a GitHub Environment (approvals + scoped secrets)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Apply pending schema migrations BEFORE any new code serves traffic.
      # Migrations must be backward-compatible with the currently-running version
      # (expand/contract) so the old pods keep working during the rollout.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter @meshify/data-access migrate

  rollout:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      # Railway rollout via the CLI. `railway up` builds each service's Dockerfile
      # (per its apps/<svc>/railway.toml) from THIS checked-out tag and deploys it.
      # Auth is a Railway PROJECT TOKEN (Project → Settings → Tokens) scoped to the
      # production environment, stored as the RAILWAY_TOKEN repo secret. If it is
      # unset this step is a no-op warning — never a failure — so you can wire it up
      # incrementally (or rely on Railway's native GitHub auto-deploy instead and
      # delete this step). Deploy order: API → BFF → consumers → web (the migrate
      # Job already ran in the job above; migrations are backward-compatible).
      #
      # On other platforms replace this step: Fly.io →
      #   flyctl deploy --image ghcr.io/${{ github.repository_owner }}/meshify-<svc>:${{ github.ref_name }}
      # Kubernetes → bump overlays/prod image tags and `kubectl apply -k overlays/prod`.
      - name: Trigger Railway deploys
        env:
          REF: ${{ github.ref_name }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::warning::RAILWAY_TOKEN not set — nothing was rolled out. Set a Railway project token to enable automated deploys, or replace this step for your platform."
            exit 0
          fi
          npm install -g @railway/cli >/dev/null 2>&1
          for name in meshify-platform-api meshify-bff meshify-worker meshify-observability meshify-web; do
            echo "→ deploying $name for $REF"
            railway up --service "$name" --ci
          done
          echo "Triggered Railway deploys."

  smoke:
    needs: rollout
    runs-on: ubuntu-latest
    steps:
      # Give the rollout a moment, then confirm the public app answers and the API
      # is ready. Fail the deploy (and alert) if either is unhealthy.
      - name: Smoke test
        env:
          APP_URL: ${{ vars.PROD_APP_URL }} # e.g. https://app.yourdomain.com
        run: |
          set -e
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/health" || true)
            echo "attempt $i: /api/health → $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "smoke test failed: /api/health never returned 200"; exit 1
