# Railway service config — meshify-bff (Clerk-session auth proxy).
#
# Wiring:
#   • Config-as-code path = apps/bff/railway.toml, Root Directory = / (repo root).
#   • Private only — the browser never hits the BFF directly; the web service's
#     nginx proxies /api to meshify-bff.railway.internal:3001 (binds :: → IPv6 OK).
#   • Env: NODE_ENV=production, PORT=3001 (Railway probes the healthcheck on $PORT and
#     the app binds it — PORT must equal the port the web nginx dials,
#     …bff.railway.internal:3001),
#     PLATFORM_API_ORIGIN=http://meshify-platform-api.railway.internal:3000,
#     APP_ORIGIN=<the web service's public URL> (CSRF allowlist — REQUIRED in prod),
#     CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, ORG_KEY_ENCRYPTION_KEY, DATABASE_URL,
#     and PLATFORM_API_KEY_PEPPER — byte-identical to the backend's value (use a
#     Railway shared variable so both reference the same secret).
#   • IMPORTANT: the BFF shares the monolithic env schema, so it validates the FULL
#     backend env at boot (REDIS_URL, QDRANT_URL, S3_*, ROCKETRIDE_*, …) even though it
#     doesn't use them. Reference the shared backend variables here too, or it exits
#     with "Invalid environment configuration" and the healthcheck never goes green.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/bff/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
