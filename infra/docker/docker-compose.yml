name: meshify-ai-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meshify
      POSTGRES_PASSWORD: meshify
      POSTGRES_DB: meshify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meshify
      MINIO_ROOT_PASSWORD: meshify123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the documents bucket on a fresh MinIO volume, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 meshify meshify123 &&
      mc mb --ignore-existing local/meshify-documents
      "

  rocketride:
    image: rocketride/server:latest
    environment:
      ROCKETRIDE_APIKEY: ${ROCKETRIDE_APIKEY}
      ROCKETRIDE_CORS_ORIGINS: "*"
    ports:
      - "5565:5565"

  platform-api:
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://meshify:meshify@postgres:5432/meshify
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://minio:9000
      ROCKETRIDE_URI: http://rocketride:5565
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://meshify:meshify@postgres:5432/meshify
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://minio:9000
      ROCKETRIDE_URI: http://rocketride:5565
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      rocketride:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
