apiVersion: v1
kind: Namespace
metadata:
  name: meshify
  labels:
    app.kubernetes.io/part-of: meshify
    # PodSecurity Admission — enforce the `restricted` standard. Every workload
    # already satisfies it (runAsNonRoot, runAsUser 1000, seccompProfile
    # RuntimeDefault, drop ALL caps, no privilege escalation, readOnlyRootFilesystem),
    # so this label makes that a hard admission gate rather than a convention.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
