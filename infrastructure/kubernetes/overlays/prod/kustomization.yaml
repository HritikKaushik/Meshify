# Prod overlay: pinned image tags (replace 1.0.0 with the released version per
# deploy — never :latest in prod), higher autoscaling ceilings. Inherits the
# base HA posture (anti-affinity, PDBs, rolling updates) unchanged.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: meshify/platform-api
    newName: ghcr.io/hritikkaushik/meshify-platform-api
    newTag: 1.0.0
  - name: meshify/worker
    newName: ghcr.io/hritikkaushik/meshify-worker
    newTag: 1.0.0
  - name: meshify/observability
    newName: ghcr.io/hritikkaushik/meshify-observability
    newTag: 1.0.0

patches:
  # REQUIRED before applying: replace api.REPLACE-ME.example.com with your real
  # public API host (the same host cert-manager will issue a certificate for).
  # Applying with the placeholder deploys a non-functional Ingress — that's the
  # C6 gap this override closes by forcing the host to be set in the prod overlay
  # rather than silently inheriting the base placeholder.
  - target:
      kind: Ingress
      name: platform-api
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api.REPLACE-ME.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.REPLACE-ME.example.com
  - target:
      kind: HorizontalPodAutoscaler
      name: platform-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: ScaledObject
      name: worker
    patch: |
      - op: replace
        path: /spec/maxReplicaCount
        value: 20
