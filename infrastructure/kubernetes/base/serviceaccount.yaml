# Dedicated ServiceAccount for every Meshify workload. None of the apps call the
# Kubernetes API, so the projected SA token is never needed — disabling automount
# removes a credential from every pod (a common lateral-movement lever) and keeps
# the default SA unused.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshify
  labels:
    app.kubernetes.io/part-of: meshify
automountServiceAccountToken: false
