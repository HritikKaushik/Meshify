# Keep at least one replica serving during voluntary disruptions (node drains,
# cluster upgrades). Only for the multi-replica workloads; observability runs a
# single instance by design and must not have a PDB blocking node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: meshify
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: meshify
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
