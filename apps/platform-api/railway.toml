# Railway service config — meshify-platform-api (core API, API-key authenticated).
#
# Wiring (do once in the Railway dashboard, see docs/operations/DEPLOYMENT_RUNBOOK.md):
#   • Service → Settings → Config-as-code path = apps/platform-api/railway.toml
#   • Root Directory = / (repo root) so the Dockerfile's pnpm-workspace context resolves.
#   • Private only — do NOT generate a public domain. Reached at
#     meshify-platform-api.railway.internal:3000 (binds :: by default → IPv6 OK).
#   • Env: attach the shared backend variables + NODE_ENV=production and PORT=3000.
#     Railway probes the healthcheck on $PORT — the app binds $PORT when set — so
#     PORT must equal the port other services dial (…platform-api.railway.internal:3000).
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/platform-api/Dockerfile"

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
