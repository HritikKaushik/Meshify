name: meshify-ai-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meshify
      POSTGRES_PASSWORD: meshify
      POSTGRES_DB: meshify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # The qdrant image ships neither wget nor curl, but does include bash — use
    # its /dev/tcp to confirm the REST port is accepting connections.
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meshify
      MINIO_ROOT_PASSWORD: meshify123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the documents bucket on a fresh MinIO volume, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 meshify meshify123 &&
      mc mb --ignore-existing local/meshify-documents
      "

  # NOTE: there is no public "rocketride/server" image to self-host locally —
  # a `docker pull` of it fails with access denied. RocketRide runs either via
  # the VS Code extension (which can proxy to a local or cloud-hosted server)
  # or as a managed cloud endpoint (ROCKETRIDE_URI=https://api.rocketride.ai).
  # ROCKETRIDE_URI/APIKEY therefore come from env_file (.env) below, same as
  # every other app/worker — do NOT hardcode a `rocketride` service hostname
  # here again; it silently overrides .env since Compose `environment:` always
  # wins over `env_file`, which is exactly the bug this comment replaced.
  #
  # QDRANT_URL/QDRANT_API_KEY are likewise NOT overridden here: when RocketRide
  # runs in the cloud it must reach Qdrant over the internet (e.g. Qdrant
  # Cloud), so Qdrant's location must come from .env. For a fully-local stack
  # using the qdrant service below, set QDRANT_URL=http://qdrant:6333 in .env.

  platform-api:
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://meshify:meshify@postgres:5432/meshify
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://meshify:meshify@postgres:5432/meshify
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Single long-lived DAP subscriber — do NOT scale without leader election
  # (each replica would double-write). See apps/observability/src/main.ts.
  observability:
    build:
      context: ../..
      dockerfile: apps/observability/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://meshify:meshify@postgres:5432/meshify
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
