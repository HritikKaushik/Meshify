# The DAP event ingester elects a single ACTIVE leader via a Postgres advisory
# lock (see apps/observability/leader-election.ts): only the leader subscribes /
# writes pipeline_runs; extra replicas block as hot standbys and take over if the
# leader dies. That makes >1 replica and rolling updates safe (a brief handover
# overlap is harmless — upserts are keyed by run_key). RollingUpdate with a
# surge lets a new pod stand by and take over the instant the old one releases
# the lock. Bump replicas to 2 for hot-standby HA; no HPA (leadership, not load,
# gates work).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: meshify
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # keep a leader running during the roll
      maxSurge: 1 # new pod stands by, takes over when the old releases the lock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability
        app.kubernetes.io/part-of: meshify
    spec:
      serviceAccountName: meshify
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observability
          image: meshify/observability:latest
          envFrom:
            - configMapRef:
                name: meshify-config
            - secretRef:
                name: meshify-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
