# TEMPLATE ONLY — do not commit real secrets. Copy to app-secrets.yaml (which is
# gitignored), fill in real values, and apply it out-of-band, OR provision this
# Secret via a sealed-secret / external-secrets operator in production. The base
# kustomization does NOT include this file; overlays reference the Secret by name
# (meshify-secrets) and expect it to already exist in the namespace.
apiVersion: v1
kind: Secret
metadata:
  name: meshify-secrets
  labels:
    app.kubernetes.io/part-of: meshify
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@postgres.host:5432/meshify"
  REDIS_URL: "redis://redis.host:6379"
  QDRANT_API_KEY: ""
  S3_ACCESS_KEY_ID: "REPLACE_ME"
  S3_SECRET_ACCESS_KEY: "REPLACE_ME"
  ROCKETRIDE_APIKEY: "REPLACE_ME"
  ROCKETRIDE_OPENAI_KEY: "REPLACE_ME"
  ROCKETRIDE_GEMINI_KEY: ""
  GITHUB_APP_ID: "REPLACE_ME"
  GITHUB_APP_PRIVATE_KEY: "REPLACE_ME"
  GITHUB_APP_WEBHOOK_SECRET: "REPLACE_ME"
  # GitHub App user-authorization OAuth (secure connect flow). Required if the
  # github provider is used; leave the App's non-GitHub features unaffected if not.
  GITHUB_APP_CLIENT_ID: "REPLACE_ME"
  GITHUB_APP_CLIENT_SECRET: "REPLACE_ME"
  # REQUIRED by platform-api: encrypts each org's API key + all integration/LLM/
  # Slack credentials at rest (the CredentialVault key). At least 32 chars,
  # high-entropy — generate with `openssl rand -base64 32`. Rejected at boot in
  # production if it looks like a placeholder. Without it the vault cannot operate.
  ORG_KEY_ENCRYPTION_KEY: "REPLACE_ME_WITH_A_RANDOM_32_BYTE_KEY"
  # Optional: decouples integration-credential encryption from ORG_KEY_ENCRYPTION_KEY
  # (falls back to it when empty). Same strength requirement if set.
  INTEGRATION_ENCRYPTION_KEY: ""
  # Gates the Prometheus /metrics endpoint; the ServiceMonitor scrapes with this
  # value as a bearer token. Generate with `openssl rand -base64 32`.
  METRICS_TOKEN: ""
  # Optional Slack connector (org-level conversation ingestion). Fill only if used.
  SLACK_CLIENT_ID: ""
  SLACK_CLIENT_SECRET: ""
  SLACK_SIGNING_SECRET: ""
  # At least 16 chars, high-entropy; rotating this invalidates all issued API keys
  # (see README). Generate with `openssl rand -base64 32`. Rejected at boot in
  # production if it looks like a placeholder.
  PLATFORM_API_KEY_PEPPER: "REPLACE_ME_WITH_A_RANDOM_32_CHAR_STRING"
