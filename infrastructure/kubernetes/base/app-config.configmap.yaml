# Non-secret runtime configuration, shared by every app/worker (each calls the
# same loadEnv() which validates the full schema, so all three consume the same
# ConfigMap + Secret). Secrets live in app-secrets (see app-secrets.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: meshify-config
  labels:
    app.kubernetes.io/part-of: meshify
data:
  NODE_ENV: "production"
  PLATFORM_PORT: "3000"
  PLATFORM_LOG_LEVEL: "info"
  RATE_LIMIT_MAX: "120"
  RATE_LIMIT_WINDOW_SEC: "60"
  # Point these at your managed services (or in-cluster service DNS).
  QDRANT_URL: "http://qdrant.meshify.svc.cluster.local:6333"
  S3_ENDPOINT: "https://s3.amazonaws.com"
  S3_REGION: "us-east-1"
  S3_BUCKET: "meshify-documents"
  S3_FORCE_PATH_STYLE: "false"
  # Non-secret GitHub App slug (github.com/apps/<slug>) — builds the Connect GitHub
  # install URL. Set alongside the GITHUB_APP_* secrets if the github provider is used.
  GITHUB_APP_SLUG: "your-github-app-slug"
  # Static Slack OAuth callback (non-secret). Set only if the Slack connector is used.
  # SLACK_REDIRECT_URI: "https://app.yourdomain.com/oauth/slack/callback"
  # In-cluster self-hosted engine shown here. For the MANAGED CLOUD engine set this
  # to the cloud endpoint instead, e.g. "https://api.rocketride.ai" (verified
  # reachable + authenticating), and put the cloud ROCKETRIDE_APIKEY in the Secret.
  ROCKETRIDE_URI: "http://rocketride.meshify.svc.cluster.local:5565"
