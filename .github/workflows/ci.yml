name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # version is read from packageManager in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck, build, test
        run: pnpm exec turbo run typecheck build test

      # Coverage over every source file with ratcheting thresholds (see
      # vitest.config.ts); a drop below them fails the build.
      - name: Coverage thresholds
        run: pnpm test:coverage

      # Full dependency audit (prod + dev). Transitive-only advisories that the
      # dependents haven't re-released for are lifted with scoped `pnpm.overrides`
      # in package.json (one per vulnerable major). If a future dev-only advisory
      # has no fix yet and must ship, narrow this to `--prod` (dev tooling isn't in
      # the images or run in prod) rather than lowering the level.
      # The registry's audit endpoint has outages that last hours. Retry, and
      # if every attempt died on the network (never a finding) report a warning
      # instead of failing: Trivy scans the same lockfile in the image jobs, so
      # a vulnerable tree is still caught, while a registry blip no longer
      # blocks a release.
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --audit-level=high 2>&1 | tee /tmp/audit.log; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "audit attempt $attempt failed; retrying in 20s"; sleep 20; fi
          done
          if grep -qE "ERR_SOCKET_TIMEOUT|ECONNRESET|ETIMEDOUT|EAI_AGAIN|FetchError" /tmp/audit.log && ! grep -qE "vulnerabilit(y|ies) found" /tmp/audit.log; then
            echo "::warning::pnpm audit could not reach the npm registry after 3 attempts; skipped (Trivy still scans the lockfile in the image jobs)."
            exit 0
          fi
          echo "audit failed after 3 attempts"; exit 1

  # The real-Postgres suites (tests/integration): the exact SQL, the migrations
  # as applied, cascades and the advisory locks. They skip themselves without a
  # database, so this is the only place they run for sure.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meshify
          POSTGRES_PASSWORD: meshify
          POSTGRES_DB: meshify
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U meshify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://meshify:meshify@localhost:5433/meshify
      # The migrator loads the full env schema; everything but the database is a placeholder here.
      REDIS_URL: redis://localhost:6379
      QDRANT_URL: http://localhost:6333
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: meshify
      S3_ACCESS_KEY_ID: ci-placeholder-access-key
      S3_SECRET_ACCESS_KEY: ci-placeholder-secret-key-value
      ROCKETRIDE_URI: http://localhost:8000
      ROCKETRIDE_APIKEY: rr_ci_placeholder_key
      PLATFORM_API_KEY_PEPPER: ci-placeholder-pepper-value-16
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (the migrator and repositories run from dist)
        run: pnpm exec turbo run build --filter=@meshify/data-access
      - name: Apply migrations
        run: pnpm migrate
      - name: Integration tests
        run: pnpm test:integration

  # Secret scanning across the full history — catches a committed key before it
  # ships. gitleaks-action is free for personal repos.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Render Blueprint is deploy config: a typo there fails only at Blueprint
  # sync time, in the Dashboard. Validate it against Render's published JSON
  # schema so a broken render.yaml never reaches main.
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate render.yaml against Render's schema
        run: |
          curl -fsSL https://render.com/schema/render.yaml.json -o /tmp/render.schema.json
          # Render's schema is draft 2020-12 and uses `format: uri`, so run ajv non-strict with ajv-formats.
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 --strict=false -c ajv-formats --all-errors \
            -s /tmp/render.schema.json -d render.yaml

  # Build (and, on main, publish) the deployable backend images. Catches
  # Dockerfile/packaging regressions that the JS build can't — e.g. a missing
  # COPY of migrations or the lockfile — which have bitten us before. The bff is
  # a plain Node service (no build args), so it rides the same matrix; web needs
  # a build-time VITE_ arg and is built in its own job below.
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [platform-api, worker, observability, bff]
    steps:
      - uses: actions/checkout@v7

      # GHCR (like every OCI registry) rejects uppercase repository names, and
      # github.repository_owner keeps the owner's casing (HritikKaushik), so the
      # image name must be lowercased in a step; expressions have no lower().
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meshify-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Only authenticate/push on main; PRs from forks can't access packages:write.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true # keep the image in the local daemon so Trivy can scan it
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'pr' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Fail only on FIXABLE high/critical CVEs — unfixable base-image noise
      # shouldn't block a release; a fixable one means "rebuild on a newer base".
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The web SPA is built separately because it bakes a build-time public var
  # (VITE_CLERK_PUBLISHABLE_KEY — publishable/non-secret) into the bundle, so the
  # image is environment-specific. The key comes from a repo variable (Settings →
  # Variables); an empty value still builds fine (the key is only read at runtime).
  web-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name # lowercased, see the images job
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meshify-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true # keep the image in the local daemon so Trivy can scan it
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'pr' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # The nginx config is rendered from a template at container start; a bad
      # directive would otherwise surface only as a crash-looping web service.
      # `nginx -t` runs the image's entrypoint hooks (envsubst included) first.
      - name: Validate the rendered nginx config
        run: docker run --rm -e BFF_UPSTREAM=bff:3001 ${{ steps.image.outputs.name }}:${{ github.sha }} nginx -t

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
